name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

permissions:
  contents: read

jobs:
  test:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        shell: bash
        run: |
          start=$(date +%s)
          files=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
          test -z "$files" || { printf '%s\n' "$files"; exit 1; }
          echo "format_seconds=$(($(date +%s)-start))"
      - name: Vet
        shell: bash
        run: |
          start=$(date +%s)
          go vet ./...
          echo "vet_seconds=$(($(date +%s)-start))"
      - name: Test
        shell: bash
        run: |
          start=$(date +%s)
          go test ./...
          echo "test_seconds=$(($(date +%s)-start))"
      - name: Build
        shell: bash
        run: |
          start=$(date +%s)
          go build ./cmd/agentpack
          echo "build_seconds=$(($(date +%s)-start))"

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Race tests
        run: |
          start=$(date +%s)
          go test -race ./...
          echo "race_seconds=$(($(date +%s)-start))"
