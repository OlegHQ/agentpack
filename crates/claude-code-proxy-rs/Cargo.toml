[package]
name = "claude-code-proxy-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pure Rust Anthropic-to-OpenAI Codex proxy core"

[lib]
name = "claude_code_proxy"
path = "src/lib.rs"

[features]
default = ["server"]
http-client = ["dep:reqwest"]
server = ["http-client", "dep:anyhow", "dep:rustls", "dep:tiny_http", "dep:tungstenite"]
token-count = []

[dependencies]
anyhow = { version = "1", optional = true }
async-stream = "0.3"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-core = "0.3"
futures-util = "0.3"
http = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tiny_http = { version = "0.12", optional = true }
tokio = { version = "1", features = ["macros", "rt", "io-util", "process"] }
tungstenite = { version = "0.28", optional = true, default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
url = "2"
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["aws_lc_rs"] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "process"] }
